name: smoke

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke test
        run: bash tests/smoke.sh
      - name: Dry-run setup
        run: |
          mkdir -p /tmp/fake-cursor-test
          HOME=/tmp/fake-home bash setup.sh --project-dir /tmp/fake-cursor-test --dry-run
